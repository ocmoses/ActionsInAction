name: Amazon-Tribe-Frontend.

on:
 push:
    branches:
      - dev
      - stage
 workflow_dispatch:
    branches:
      - main
jobs:

# Scan repo for secrets with Trufflehog 
 TruffleHog-Secret-Scan:
    runs-on: 
      - ubuntu-latest
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: development # ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug #--only-verified

 linting:
    needs:  TruffleHog-Secret-Scan
    runs-on:
      - self-hosted
      - tribe-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Lint PHP file
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 -P8 php -l

 deployment:
    needs: linting
    runs-on:
      - self-hosted
      - tribe-frontend
     
    steps:
      - name: Checkout
        # if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v2

      - uses: benjlevesque/short-sha@v1.2
        id: short-sha
        with:
          length: 6
      - run: echo $SHA
        env: 
          SHA: ${{ steps.short-sha.outputs.sha }}
      - run: echo $SHA
        env: 
          SHA: ${{ env.SHA }}

      - name: 'dev nginx conf'
        if: github.ref == 'refs/heads/dev'
        run: |
          cp dev_default/default.conf default.conf
        
      - name: Login to dev image repository
        if: github.ref == 'refs/heads/dev'
        uses: docker/login-action@v2
        env:
           REGISTRY: ojtkgsbharb01.mtn.com.ng/amazon-tribe
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.UNAME }}
          password: ${{ secrets.PASSWD }}
      - name: pull base image
        if: github.ref == 'refs/heads/dev'
        run: |
          docker pull ojtkgsbharb01.mtn.com.ng/amazon-tribe/amazon-tribe-frontend-dev:base
      - name: Build and push dev harbor
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v3
        env:
           REGISTRY: ojtkgsbharb01.mtn.com.ng/amazon-tribe/amazon-tribe-frontend-dev
           IMAGE_TAG: ${{ env.SHA }}
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}:${{ env.IMAGE_TAG }}

      - name: Check out dev helm repo
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v2
        with:
          ref: dev
          #repository: gkhhgcl/helm-chart
          # new helm repo
          repository: MTNNigeria/Helm-Charts
          token: ${{ secrets.my_pat }}

      - name: Update dev helm repo
        if: github.ref == 'refs/heads/dev'
        env:
          IMAGE_TAG: ${{ env.SHA }}
        run: |
            yq e '.image.version = "'$IMAGE_TAG'"' -i /export/home/dmsb_girish/amazon-tribe-frontend-runner/_work/Amazon-Tribe-Frontend/Amazon-Tribe-Frontend/Amazon-Tribe/frontend/charts/helm-example/values.yaml
            git config --global user.name 'gkhhgcl'
            git config --global user.email "girish.kumar@hhgcl.com"
            git add .
            git commit -m "updated values.yml file"
            echo "Done.."
            git push origin dev
##### stage #####
      - name: 'stage nginx conf'
        if: github.ref == 'refs/heads/stage'
        run: |
          cp stage_default/default.conf default.conf
        
      - name: Login to staging image repository
        if: github.ref == 'refs/heads/stage'
        uses: docker/login-action@v2
        env:
           REGISTRY: ojtkgprepodharb01.mtn.com.ng/amazon-tribe-frontend
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.UNAME_STAGE }}
          password: ${{ secrets.PASSWD_STAGE }}

      - name: pull base image
        if: github.ref == 'refs/heads/stage'
        run: |
          docker pull ojtkgprepodharb01.mtn.com.ng/amazon-tribe-frontend/amazon-tribe-frontend:base
          
      - name: Build and push to stage harbor
        if: github.ref == 'refs/heads/stage'
        uses: docker/build-push-action@v3
        env:
           REGISTRY: ojtkgprepodharb01.mtn.com.ng/amazon-tribe-frontend/amazon-tribe-frontend
           IMAGE_TAG: ${{ env.SHA }}
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}:${{ env.IMAGE_TAG }}

      - name: Check out stage helm repo
        if: github.ref == 'refs/heads/stage'
        uses: actions/checkout@v2
        with:
          ref: stage
          repository: gkhhgcl/helm-chart
          token: ${{ secrets.my_pat }}

      - name: Update stage helm repo
        if: github.ref == 'refs/heads/stage'
        env:
          IMAGE_TAG: ${{ env.SHA }}
        run: |
            yq e '.image.version = "'$IMAGE_TAG'"' -i /export/home/dmsb_girish/amazon-tribe-frontend-runner/_work/Amazon-Tribe-Frontend/Amazon-Tribe-Frontend/Amazon-Tribe/frontend/charts/helm-example/values.yaml
            git config --global user.name 'gkhhgcl'
            git config --global user.email "girish.kumar@hhgcl.com"
            git add .
            git commit -m "updated values.yml file"
            echo "Done.."
            git push origin stage

##### prod #####
      - name: 'Prod nginx conf'
        if: github.ref == 'refs/heads/main'
        run: |
          cp prod_default/default.conf default.conf
        
      - name: Login to prod image repository
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        env:
           REGISTRY: ojtkgprodharb01.mtn.com.ng/amazon-tribe-frontend
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.UNAME_PROD }}
          password: ${{ secrets.PASSWD_PROD }}

      - name: pull base image
        if: github.ref == 'refs/heads/stage'
        run: |
          docker pull ojtkgprodharb01.mtn.com.ng/amazon-tribe-frontend/amazon-tribe-frontend:base

      - name: Build and push prod harbor
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v3
        env:
           REGISTRY: ojtkgprodharb01.mtn.com.ng/amazon-tribe-frontend/amazon-tribe-frontend
           IMAGE_TAG: ${{ env.SHA }}
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}:${{ env.IMAGE_TAG }}

      - name: Check out prod helm repo
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v2
        with:
          ref: prod
          repository: gkhhgcl/helm-chart
          token: ${{ secrets.my_pat }}

      - name: Update prod helm repo
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ env.SHA }}
        run: |
            yq e '.image.version = "'$IMAGE_TAG'"' -i /export/home/dmsb_girish/amazon-tribe-frontend-runner/_work/Amazon-Tribe-Frontend/Amazon-Tribe-Frontend/Amazon-Tribe/frontend/charts/helm-example/values.yaml
            git config --global user.name 'gkhhgcl'
            git config --global user.email "girish.kumar@hhgcl.com"
            git add .
            git commit -m "updated values.yml file"
            echo "Done.."
            git push origin prod
