server {
#	listen 80 default_server;
	listen 443 ssl default_server;
        ssl_certificate /etc/ssl/private/domain.tld.chained.crt;
        ssl_certificate_key /etc/ssl/private/domain.tld.key;
	root /usr/share/nginx/html;

	# Add index.php to the list if you are using PHP
	index index.html index.htm index.php index.nginx-debian.html;

	server_name staging-partnerportal.mtn.ng;
        client_max_body_size 999M;
	error_page 404 /index.html;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		proxy_pass http://localhost:3000;
		add_header X-Frame-Options "SAMEORIGIN";
            add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com *.google.com https://*.ggpht.com *.googleusercontent.com https://cdnjs.cloudflare.com blob:;img-src 'self' https://*.googleapis.com https://*.gstatic.com *.google.com  *.googleusercontent.com data:;frame-src *.google.com *.mtn.ng;connect-src https://*.googleapis.com 'self' *.google.com https://*.gstatic.com  data: blob:;font-src 'self' https://fonts.gstatic.com;style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;worker-src blob:;frame-ancestors https://www.mtn.ng https://mtn.ng;";
            add_header X-Content-Type-Options "nosniff";
            add_header Referrer-Policy "strict-origin";
            add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()" always;
	}

        location /api/next {
                proxy_pass http://localhost:3000;
                }
	location /api {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		# proxy_pass http://10.1.29.77:80/;
		#proxy_pass http://amazon-tribe-backend;
		proxy_pass https://api-staging-partnerportal.mtn.ng;
		add_header X-Frame-Options "SAMEORIGIN";
            add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com *.google.com https://*.ggpht.com *.googleusercontent.com https://cdnjs.cloudflare.com blob:;img-src 'self' https://*.googleapis.com https://*.gstatic.com *.google.com  *.googleusercontent.com data:;frame-src *.google.com *.mtn.ng;connect-src https://*.googleapis.com 'self' *.google.com https://*.gstatic.com  data: blob:;font-src 'self' https://fonts.gstatic.com;style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;worker-src blob:;frame-ancestors https://www.mtn.ng https://mtn.ng;";
            add_header X-Content-Type-Options "nosniff";
            add_header Referrer-Policy "strict-origin";
            add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()" always;
	}

	location ~ /\.(?!well-known).* {
        	deny all;
    	}
}
